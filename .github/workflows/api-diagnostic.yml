name: DENUE API diagnostics
on:
  push:
    branches: [fix/denue-response-diagnostics]
  workflow_dispatch:

jobs:
  inspect-live-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Inspect API response format without logging the token
        run: python scripts/diagnose_api.py
